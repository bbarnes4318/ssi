name: Final image correction
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          founder = (
            '<div class="founder">\n'
            '      <div class="founder__top">\n'
            '        <img src="/assets/img/chris-martin-2.jpg" alt="Chris Martin, founder and CEO of Senior Solutions Insurance" width="800" height="800" loading="lazy" decoding="async">\n'
            '        <div class="founder__plate">\n'
            '          <strong>Chris Martin</strong>\n'
            '          <span>Founder &amp; CEO · Licensed insurance agent</span>\n'
            '          <span>Senior Solutions Insurance, est. 2008</span>\n'
            '        </div>\n'
            '      </div>\n'
            '      <blockquote class="founder__q">"We go out of our way to genuinely help others because it is our core value. We make buying Final Expense Insurance easy."</blockquote>\n'
            '    </div>'
          )
          p = Path('src/pages/about-us.html')
          s = p.read_text().replace('<div class="founder"></div>', founder, 1)
          p.write_text(s)
          p = Path('src/pages/home.html')
          s = p.read_text().replace('/assets/img/chris-martin-2.jpg" alt="The Senior Solutions Insurance team around the conference table in their Greenwood Village office"', '/assets/img/team-office-2.jpg" alt="The Senior Solutions Insurance team standing together in their Greenwood Village office"', 1)
          p.write_text(s)
          p = Path('about-us/index.html')
          s = p.read_text().replace('<picture><source type="image/webp" srcset="/assets/img/team-meeting-2.webp"><img src="/assets/img/team-meeting-2.jpg" alt="The whole Senior Solutions team standing together in the office" width="1600" height="960" loading="lazy" decoding="async"></picture>', founder, 1)
          p.write_text(s)
          p = Path('index.html')
          s = p.read_text().replace('/assets/img/chris-martin-2.webp', '/assets/img/team-office-2.webp', 1).replace('/assets/img/chris-martin-2.jpg" alt="The Senior Solutions Insurance team around the conference table in their Greenwood Village office"', '/assets/img/team-office-2.jpg" alt="The Senior Solutions Insurance team standing together in their Greenwood Village office"', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about-us.html src/pages/home.html about-us/index.html index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore intended Chris and team imagery"
          git push