name: Fix image placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct image placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          about = Path('src/pages/about-us.html')
          s = about.read_text()
          why_old = '''<div class="founder">\n      <div class="founder__top">\n        <img src="/assets/img/team-office-2.jpg" alt="Chris Martin, founder and CEO of Senior Solutions Insurance" width="800" height="800" loading="lazy" decoding="async">\n        <div class="founder__plate">\n          <strong>Chris Martin</strong>\n          <span>Founder &amp; CEO · Licensed insurance agent</span>\n          <span>Senior Solutions Insurance, est. 2008</span>\n        </div>\n      </div>\n      <blockquote class="founder__q">"We go out of our way to genuinely help others because it is our core value. We make buying Final Expense Insurance easy."</blockquote>\n    </div>'''
          why_new = '''<img src="/assets/img/team-office-2.jpg" alt="The whole Senior Solutions team standing together in the office" width="1600" height="960" loading="lazy" decoding="async">'''
          if why_old not in s: raise SystemExit('Expected Why block not found')
          s = s.replace(why_old, why_new, 1)
          meet_old = '''<img src="/assets/img/team-meeting-2.jpg" alt="The whole Senior Solutions team standing together in the office" width="1600" height="960" loading="lazy" decoding="async">'''
          meet_new = '''<div class="founder">\n      <div class="founder__top">\n        <img src="/assets/img/chris-martin-2.jpg" alt="Chris Martin, founder and CEO of Senior Solutions Insurance" width="800" height="800" loading="lazy" decoding="async">\n        <div class="founder__plate">\n          <strong>Chris Martin</strong>\n          <span>Founder &amp; CEO · Licensed insurance agent</span>\n          <span>Senior Solutions Insurance, est. 2008</span>\n        </div>\n      </div>\n      <blockquote class="founder__q">"We go out of our way to genuinely help others because it is our core value. We make buying Final Expense Insurance easy."</blockquote>\n    </div>'''
          if meet_old not in s: raise SystemExit('Expected Meet image not found')
          s = s.replace(meet_old, meet_new, 1)
          about.write_text(s)

          home = Path('src/pages/home.html')
          s = home.read_text()
          old = '/assets/img/chris-martin-2.jpg" alt="The Senior Solutions Insurance team around the conference table in their Greenwood Village office"'
          new = '/assets/img/team-office-2.jpg" alt="The Senior Solutions Insurance team standing together in their Greenwood Village office"'
          if old not in s: raise SystemExit('Expected homepage image not found')
          home.write_text(s.replace(old, new, 1))

          # Keep committed generated HTML aligned with the source changes.
          about_out = Path('about-us/index.html')
          t = about_out.read_text()
          t = t.replace('/assets/img/team-office-2.webp', '/assets/img/team-office-2.webp', 1)
          t = re.sub(r'(<h2>Why our agents start with the products</h2>.*?)(<div class="founder">.*?</div>\s*</div>\s*</section>)', lambda m: m.group(1) + '<img src="/assets/img/team-office-2.jpg" alt="The whole Senior Solutions team standing together in the office" width="1600" height="960" loading="lazy" decoding="async">' + '</div>\n</section>', t, count=1, flags=re.S)
          t = re.sub(r'(<h2>Meet Chris Martin</h2>.*?<p class="badge__wrap">.*?</p>\s*</div>\s*)<img[^>]+>', lambda m: m.group(1) + '<div class="founder"><div class="founder__top"><img src="/assets/img/chris-martin-2.jpg" alt="Chris Martin, founder and CEO of Senior Solutions Insurance" width="800" height="800" loading="lazy" decoding="async"><div class="founder__plate"><strong>Chris Martin</strong><span>Founder &amp; CEO · Licensed insurance agent</span><span>Senior Solutions Insurance, est. 2008</span></div></div><blockquote class="founder__q">"We go out of our way to genuinely help others because it is our core value. We make buying Final Expense Insurance easy."</blockquote></div>', t, count=1, flags=re.S)
          about_out.write_text(t)

          home_out = Path('index.html')
          t = home_out.read_text()
          t = t.replace('/assets/img/chris-martin-2.webp', '/assets/img/team-office-2.webp', 1)
          t = t.replace('/assets/img/chris-martin-2.jpg" alt="The Senior Solutions Insurance team around the conference table in their Greenwood Village office"', '/assets/img/team-office-2.jpg" alt="The Senior Solutions Insurance team standing together in their Greenwood Village office"', 1)
          home_out.write_text(t)
          PY
      - name: Commit corrected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f image-fix-trigger.txt
          git add src/pages/about-us.html src/pages/home.html about-us/index.html index.html image-fix-trigger.txt
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore intended Chris and team imagery"
          git push