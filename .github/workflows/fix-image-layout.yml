name: Fix image placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair exact image placements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          founder = '''<div class="founder">
      <div class="founder__top">
        <img src="/assets/img/chris-martin-2.jpg" alt="Chris Martin, founder and CEO of Senior Solutions Insurance" width="800" height="800" loading="lazy" decoding="async">
        <div class="founder__plate">
          <strong>Chris Martin</strong>
          <span>Founder &amp; CEO · Licensed insurance agent</span>
          <span>Senior Solutions Insurance, est. 2008</span>
        </div>
      </div>
      <blockquote class="founder__q">"We go out of our way to genuinely help others because it is our core value. We make buying Final Expense Insurance easy."</blockquote>
    </div>'''

          # Source About page: restore the full Chris founder card if a prior pass emptied it.
          p = Path('src/pages/about-us.html')
          s = p.read_text().replace('<div class="founder"></div>', founder, 1)
          p.write_text(s)

          # Source homepage: the image immediately below the hero/trust area is team-office-2.
          p = Path('src/pages/home.html')
          s = p.read_text().replace('/assets/img/chris-martin-2.jpg" alt="The Senior Solutions Insurance team around the conference table in their Greenwood Village office"', '/assets/img/team-office-2.jpg" alt="The Senior Solutions Insurance team standing together in their Greenwood Village office"', 1)
          p.write_text(s)

          # Generated About page: replace the Meet image with the same founder card.
          p = Path('about-us/index.html')
          t = p.read_text()
          meet_img = r'<picture><source type="image/webp" srcset="/assets/img/team-meeting-2.webp"><img src="/assets/img/team-meeting-2.jpg" alt="The whole Senior Solutions team standing together in the office" width="1600" height="960" loading="lazy" decoding="async"></picture>'
          t = t.replace(meet_img, founder, 1)
          p.write_text(t)

          # Generated homepage: swap the first Who-we-are image from Chris to team-office.
          p = Path('index.html')
          t = p.read_text().replace('/assets/img/chris-martin-2.webp', '/assets/img/team-office-2.webp', 1)
          t = t.replace('/assets/img/chris-martin-2.jpg" alt="The Senior Solutions Insurance team around the conference table in their Greenwood Village office"', '/assets/img/team-office-2.jpg" alt="The Senior Solutions Insurance team standing together in their Greenwood Village office"', 1)
          p.write_text(t)
          PY
      - name: Commit corrected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about-us.html src/pages/home.html about-us/index.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Chris founder card and team imagery"
          git push