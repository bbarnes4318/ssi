name: Repair homepage founder image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only the An agency built the old-fashioned way image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          marker = '<h2>An agency built the old-fashioned way</h2>'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Target heading not found')
          start = s.rfind('<section', 0, pos)
          end = s.find('</section>', pos)
          if start < 0 or end < 0:
              raise SystemExit('Target section bounds not found')
          block = s[start:end]
          old = '/assets/img/team-office-2.jpg'
          new = '/assets/img/chris-martin-2.jpg'
          if old not in block:
              raise SystemExit('Expected team-office image not found in target section')
          block = block.replace(old, new, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Chris image in homepage founder section"
          git push
