name: Fix homepage founder picture source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only homepage founder WebP source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<h2>An agency built the old-fashioned way</h2>'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Target heading not found')
          start = s.rfind('<section', 0, pos)
          end = s.find('</section>', pos)
          block = s[start:end]
          old = '<source type="image/webp" srcset="/assets/img/team-office-2.webp">'
          new = '<source type="image/webp" srcset="/assets/img/chris-martin-2.webp">'
          if old not in block:
              raise SystemExit('Wrong WebP source not found in target founder section')
          block = block.replace(old, new, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix homepage founder image source'
          git push
